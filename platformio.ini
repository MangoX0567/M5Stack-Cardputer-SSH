[platformio]
default_envs = m5cardputer-adv

[env:m5cardputer-adv]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
test_build_src = yes
build_src_flags =
    -Wall
    -Wextra
    -Werror
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    m5stack/M5Unified@0.2.19
    https://github.com/m5stack/M5GFX.git#0.2.26
    z3t0/IRremote@4.7.1
    ewpa/LibSSH-ESP32@5.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<AppConfig.cpp>
    +<ProfileStore.cpp>
    +<WifiScanModel.cpp>
    +<WifiProfileSelector.cpp>
    +<KeyboardLayout.cpp>
    +<HostCatalog.cpp>
    +<SshDiscovery.cpp>
    +<SessionFlow.cpp>
    +<Diagnostics.cpp>
    +<KeyboardRouter.cpp>
    +<ScrollbackViewport.cpp>
    +<TerminalKeyEncoder.cpp>
    +<TextEditModel.cpp>
    +<ListViewport.cpp>
    +<HostDraftTransaction.cpp>
    +<TerminalGlyphs.cpp>
    +<TerminalGlyphScale.cpp>
    +<TerminalPalette.cpp>
    +<TerminalScreen.cpp>
    +<TerminalHistory.cpp>
    +<TerminalEmulator.cpp>
    +<TerminalViewport.cpp>
    +<TerminalUiModel.cpp>
build_src_flags =
    -Wall
    -Wextra
    -Werror
